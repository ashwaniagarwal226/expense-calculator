spring.application.name=expense-calculator
server.servlet.context-path=/api/expense
server.port=8081
spring.datasource.url=jdbc:h2:~/epnx_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.show_sql=false
#spring.jpa.properties.hibernate.use_sql_comments=true
#spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Bank statement layouts, the initial category/rule set, and optional local secrets (gitignored)
spring.config.import=classpath:banks.yml,classpath:category-seed.yml,optional:file:./application-local.properties

# ---------------------------------------------------------------------------
# Gemini via Spring AI (Google GenAI starter, Gemini Developer API key)
# Get a key at https://aistudio.google.com/apikey and either export GEMINI_API_KEY or put
#   spring.ai.google.genai.api-key=...
# in ./application-local.properties (gitignored). Never put the key in this file.
# Without a key the app still runs: rules-only categorisation + heuristic tips.
# ---------------------------------------------------------------------------
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
# gemini-2.5-* is closed to new API keys; Google recommends gemini-3.8-flash (or gemini-3.5-flash-lite).
# See https://ai.google.dev/gemini-api/docs/models
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
# Gemini 3 defaults to HIGH thinking; LOW is plenty for categorisation and keeps uploads fast.
# (MINIMAL | LOW | MEDIUM | HIGH. Only Gemini 3+ models accept this - remove it if you go back to a 2.x model.)
spring.ai.google.genai.chat.options.thinking-level=${GEMINI_THINKING_LEVEL:LOW}
# Temperature is left at the model default (1.0): Google warns that lowering it on Gemini 3
# can cause looping or degraded output.

expense.ai.enabled=${EXPENSE_AI_ENABLED:true}
expense.ai.model=${spring.ai.google.genai.chat.options.model}
# narrations sent to Gemini per request
expense.ai.batch-size=25
# convert confident AI answers into keyword rules (source=AI) so they are free next time
expense.ai.learn-rules=true
expense.ai.min-confidence-to-learn=0.8

spring.application.name=expense-calculator
server.servlet.context-path=/api/expense
server.port=8081
spring.datasource.url=jdbc:h2:~/epnx_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.show_sql=false
#spring.jpa.properties.hibernate.use_sql_comments=true
#spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Bank statement layouts and the initial category/rule set
spring.config.import=classpath:banks.yml,classpath:category-seed.yml

# ---------------------------------------------------------------------------
# Gemini via Spring AI (Google GenAI starter, Gemini Developer API key)
# Get a key at https://aistudio.google.com/apikey and export GEMINI_API_KEY.
# Without a key the app still runs: rules-only categorisation + heuristic tips.
# ---------------------------------------------------------------------------
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.2

expense.ai.enabled=${EXPENSE_AI_ENABLED:true}
expense.ai.model=${spring.ai.google.genai.chat.options.model}
# narrations sent to Gemini per request
expense.ai.batch-size=25
# convert confident AI answers into keyword rules (source=AI) so they are free next time
expense.ai.learn-rules=true
expense.ai.min-confidence-to-learn=0.8
